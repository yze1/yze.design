  <body>
    <main class="shell">
      <section id="auth-panel" class="auth-panel">
        <div class="auth-card">
          <div class="auth-intro">
            <h1>editq</h1>
            <label class="language-select" for="locale-select-auth">
              <span data-i18n="language.label">Language</span>
              <select id="locale-select-auth">
                <option value="en" selected>EN</option>
                <option value="fr">FR</option>
              </select>
            </label>
            <p id="auth-subtitle" data-i18n="auth.login.subtitle">Sign in to get back to your workspace.</p>
          </div>

          <div id="login-view" class="auth-view">
            <form id="login-form" class="auth-form">
              <h2 data-i18n="auth.login.title">Sign in</h2>
              <label for="login-username" data-i18n="auth.username">Username</label>
              <input id="login-username" autocomplete="username" required="">

              <label for="login-password" data-i18n="auth.password">Password</label>
              <input id="login-password" type="password" autocomplete="current-password" required="">

              <label for="login-otp" data-i18n="auth.otp">OTP code</label>
              <input id="login-otp" inputmode="numeric" autocomplete="one-time-code" maxlength="6" required="">

              <button type="submit" data-i18n="auth.login.submit">Sign in</button>
            </form>

            <p class="auth-switch">
              <span data-i18n="auth.no_account">No account yet?</span>
              <button id="show-register" class="link-button" type="button" data-i18n="auth.create_account">Create account</button>
            </p>
          </div>

          <div id="register-view" class="auth-view hidden">
            <form id="register-form" class="auth-form">
              <h2 data-i18n="auth.register.title">Create account</h2>
              <label for="register-username" data-i18n="auth.username">Username</label>
              <input id="register-username" autocomplete="username" required="">

              <label for="register-email" data-i18n="auth.email">Email</label>
              <input id="register-email" type="email" autocomplete="email" required="">

              <label for="register-password" data-i18n="auth.password">Password</label>
              <input id="register-password" type="password" autocomplete="new-password" minlength="8" required="">

              <label for="register-password-confirm" data-i18n="auth.password_confirm">Confirm password</label>
              <input id="register-password-confirm" type="password" autocomplete="new-password" minlength="8" required="">

              <fieldset id="register-plan-options" class="plan-options hidden">
                <legend data-i18n="billing.plan">Plan</legend>
                <label class="plan-option">
                  <input type="radio" name="register-plan" value="free" checked="">
                  <span>
                    <strong data-i18n="billing.free">Free</strong>
                    <small data-i18n="billing.free_detail">10 pages, 10,000 agent tokens per month</small>
                  </span>
                </label>
                <label class="plan-option is-disabled">
                  <input type="radio" name="register-plan" value="paid" disabled="">
                  <span>
                    <strong data-i18n="billing.paid">Paid</strong>
                    <small data-i18n="billing.paid_detail">100,000 pages, 1,000,000 agent tokens per month, CHF 10/month</small>
                  </span>
                </label>
              </fieldset>

              <button type="submit" class="secondary-button" data-i18n="auth.register.submit">Create account</button>
            </form>

            <div id="otp-setup" class="otp-setup hidden">
              <p data-i18n="auth.otp.instructions">Scan this QR code with your authenticator app.</p>
              <img id="otp-qr" class="otp-qr" alt="OTP QR code" data-i18n-alt="auth.otp.alt">
              <code id="otp-secret"></code>
              <button id="go-stripe-after-register" class="secondary-button hidden" type="button" data-i18n="auth.stripe.continue">Continue to Stripe</button>
              <button id="go-login-after-register" type="button" data-i18n="auth.login.submit">Sign in</button>
            </div>

            <p class="auth-switch">
              <span data-i18n="auth.already_account">Already have an account?</span>
              <button id="show-login" class="link-button" type="button" data-i18n="auth.back_login">Back to sign in</button>
            </p>
          </div>

          <p id="auth-message" class="muted">Authentification requise</p>
        </div>
      </section>

      <section id="workspace" class="workspace hidden">
      <section class="editor-toolbar">
        <div>
          <h1>editq</h1>
          <p id="api-message" data-i18n="app.loading">Loading API...</p>
        </div>
        <div class="user-menu">
          <label class="language-select compact" for="locale-select-workspace">
            <span data-i18n="language.label">Language</span>
            <select id="locale-select-workspace">
              <option value="en" selected>EN</option>
              <option value="fr">FR</option>
            </select>
          </label>
          <span id="current-user" class="current-user"></span>
          <span id="billing-summary" class="billing-summary hidden"></span>
          <span id="pdf-export-status" class="pdf-export-status" aria-live="polite"></span>
          <button id="pdf-export-button" class="secondary-button pdf-export-button" type="button" data-i18n-aria-label="pdf.export" aria-label="PDF">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M7 3h7l4 4v14H7z"></path>
              <path d="M14 3v5h5"></path>
              <path d="M9 14h6"></path>
              <path d="M9 17h4"></path>
            </svg>
            <span data-i18n="pdf.export">PDF</span>
          </button>
          <button id="billing-button" class="secondary-button hidden" type="button" data-i18n="billing.plan">Plan</button>
          <button id="logout-button" class="secondary-button" type="button" data-i18n="auth.logout.submit">Sign out</button>
        </div>
      </section>

      <section class="editor-layout">
        <aside class="tree-panel">
          <h2 data-i18n="tree.title">Pages</h2>
          <nav id="page-tree" class="page-tree" aria-label="Page tree" data-i18n-aria-label="tree.aria"></nav>
          <p id="tree-empty" class="muted hidden" data-i18n="tree.empty">No pages.</p>
        </aside>

        <article class="editor-panel">
          <label for="page-title" data-i18n="editor.title">Title</label>
          <input id="page-title" class="title-input" autocomplete="off">
          <div id="editorjs"></div>
          <p id="save-state" class="muted"></p>
        </article>

        <aside class="chat-panel" aria-label="Chatbot assistant" data-i18n-aria-label="chat.aria">
          <header class="chat-header">
            <div>
              <p class="chat-kicker" data-i18n="chat.kicker">Assistant</p>
              <h2 data-i18n="chat.title">Chatbot</h2>
              <p id="chat-model-label" class="chat-model-label">Model: ChatGPT</p>
            </div>
            <span class="chat-status" data-i18n="chat.online">Online</span>
          </header>

          <div id="chat-log" class="chat-log" aria-live="polite"></div>

          <form id="chat-form" class="chat-composer">
            <button class="chat-icon-button composer-add" type="button" aria-label="Add attachment" data-i18n-aria-label="chat.attach">
              <svg viewBox="0 0 24 24" aria-hidden="true">
                <path d="M12 5v14"></path>
                <path d="M5 12h14"></path>
              </svg>
            </button>
            <textarea id="chat-input" rows="1" placeholder="Ask a question" aria-label="Question for the chatbot" data-i18n-placeholder="chat.input.placeholder" data-i18n-aria-label="chat.input.aria"></textarea>
            <!--<button class="chat-icon-button" type="button" aria-label="Dicter">
              <svg viewBox="0 0 24 24" aria-hidden="true">
                <path d="M12 3a3 3 0 0 0-3 3v6a3 3 0 0 0 6 0V6a3 3 0 0 0-3-3Z"></path>
                <path d="M19 10v2a7 7 0 0 1-14 0v-2"></path>
                <path d="M12 19v3"></path>
              </svg>
            </button>-->
            <button class="chat-send" type="submit" aria-label="Send" data-i18n-aria-label="chat.send">
              <svg viewBox="0 0 24 24" aria-hidden="true">
                <path d="M5 12h14"></path>
                <path d="M13 6l6 6-6 6"></path>
              </svg>
            </button>
          </form>
        </aside>
      </section>
      </section>
    </main>

    <div id="alert-overlay" class="alert-overlay hidden" role="alertdialog" aria-modal="true" aria-labelledby="alert-title" aria-describedby="alert-message">
      <div class="alert-dialog">
        <h2 id="alert-title" data-i18n="alert.title">Error</h2>
        <p id="alert-message"></p>
        <button id="alert-close" type="button" data-i18n="common.ok">OK</button>
      </div>
    </div>

    <div id="tour-overlay" class="tour-overlay hidden" aria-hidden="true"></div>
    <div id="tour-popover" class="tour-popover hidden" role="dialog" aria-labelledby="tour-title" aria-describedby="tour-message">
      <div id="tour-arrow" class="tour-arrow" aria-hidden="true"></div>
      <p id="tour-step" class="tour-step"></p>
      <h2 id="tour-title"></h2>
      <p id="tour-message"></p>
      <div class="tour-actions">
        <button id="tour-skip" class="secondary-button" type="button" data-i18n="common.skip">Skip</button>
        <button id="tour-next" type="button" data-i18n="common.next">Next</button>
      </div>
    </div>

  

</body></html>
