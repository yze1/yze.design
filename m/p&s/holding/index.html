<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="icon" type="image/png" href="../assets/favicon.png">
    <title>P&S</title>

    <link rel="stylesheet" href="../css/variables.css">
    <link rel="stylesheet" href="../css/layout.css">
    <link rel="stylesheet" href="../css/typography.css">
    <link rel="stylesheet" href="../css/noise.css">
    <link rel="stylesheet" href="../css/media.css?v=2">
    <script src="https://cdn.jsdelivr.net/npm/@mux/mux-player" defer></script>
    <style>
        .holding-header .header-row .caption a:not([href$="/contact/"]):not([href="#contact"]),
        .holding-header .mobile-menu a:not([href$="/contact/"]):not([href="#contact"]) {display: none;}
    </style>
</head>
<body class="noise-black-surface">
    <div id="cursor">
        <h4><strong>&</strong></h4>
    </div>

    <div id="header" data-theme="holding-header"></div>



    <section class="compact underlap">
        <div class="s12 bleed full holding-video">
            <mux-player
                playback-id="bm55J3LyyfzFat00ZVs2MlI3FfsBonjmFiJ8202v69yZs"
                metadata-video-title="reel_trimmed"
                autoplay="muted"
                muted
                loop
                playsinline
                no-muted-pref
                aria-label="Play reel with sound"
                tabindex="0"
            ></mux-player>
            <div class="twenty-years-overlay">
                <span class="twenty-years" role="img" aria-label="20 Years of P&amp;S"></span>
            </div>
        </div>
    </section>

    <section class="red">
        <div class="space"></div>
        <div class="s12 center">
            <h2>
                New website
                <br>coming soon
            </h2>
            <h4 class="mono caps">One short line on services</h4>
        </div>
    </section>

    <div id="contact-partial"></div>


    <div id="footer"></div>

    <script src="../js/cursor.js?v=2"></script>
    <script src="../js/partials.js?v=3"></script>
    <script src="../js/noise.js"></script>
    <script src="../js/contact.js"></script>
    <script src="../js/media.js"></script>
    <script src="../js/layout.js"></script>

</body>
</html>
