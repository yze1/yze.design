<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/png" href="/favicon.png">
    
    <title>P&S</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <link rel="stylesheet" href="../css/variables.css">
    <link rel="stylesheet" href="/css/cursor.css">
    <link rel="stylesheet" href="/css/layout.css">
    <link rel="stylesheet" href="../css/typography.css">
    <link rel="stylesheet" href="../css/noise.css">
    <link rel="stylesheet" href="../css/media.css">
    <script src="https://cdn.jsdelivr.net/npm/@mux/mux-player" defer></script>
    <style>
        .holding-header .desktop-link a:not([href$="/contact/"]):not([href="#contact"]),
        .holding-header .mobile-menu a:not([href$="/contact/"]):not([href="#contact"]) {display: none;}

        .twenty-years {
            width: min(500px, 70vw);
            animation: rotate-twenty-years 30s linear infinite;
        }

        .holding-socials {
            flex-direction: row !important;
            justify-content: center;
            align-items: center;
            gap: var(--inner-gap);
        }

        .mailing-list-form {
            display: flex;
            max-width: 100%;
            background: var(--black);
        }

        .sr-only {
            position: absolute;
            width: 1px;
            height: 1px;
            overflow: hidden;
            clip: rect(0, 0, 0, 0);
        }

        .mailing-list-form input {
            min-width: 0;
            flex: 1;
            border: 0;
            outline: 0;
            padding: calc(var(--spacing) / 8) calc(var(--spacing) / 2);
            background: transparent;
            color: var(--red);
            font: 19px 'JetBrains', sans-serif;
            text-align: left;
            text-transform: uppercase;
        }

        .mailing-list-form input::placeholder {color: var(--red); opacity: 1;}

        .mailing-list-form button {
            display: grid;
            flex: 0 0 auto;
            place-items: center;
            margin: 0;
            padding: 0 calc(var(--spacing) / 2);
            /* background: var(--red); */
            background: var(--black);
        }

        .mailing-list-form button img {width: 24px; height: 24px;}

        @keyframes rotate-twenty-years {to {transform: rotate(360deg);}}

        @media (prefers-reduced-motion: reduce) {
            .twenty-years {animation: none;}
        }

        html, body {background-color: var(--black);}
    </style>
</head>
<body>
    <div id="cursor">
        <h4><strong>&</strong></h4>
    </div>

    <div id="header" data-theme="holding-header"></div>



    <section class="compact underlap">
        <div class="s12 bleed full">
            <mux-player
                playback-id="seRlvZoaZbGdWFzHkgx3GicgxrrjtUezC01yohrRoIHo"
                metadata-video-title="reel"
                autoplay="muted"
                muted
                loop
                playsinline
                no-muted-pref
                aria-label="Play reel with sound"
                tabindex="0"
            ></mux-player>
        </div>
    </section>

    <section class="red">
        <div class="space"></div>

        <div class="s12 center">
            <h2>
                New website
                <br>coming soon
            </h2>
            <h3 class="mono caps">One short line on services</h3>
        </div>
    </section>

    <section class="red bleed">
        <div class="s12 center">
            <img class="twenty-years" src="../assets/media/20years.png" alt="20 Years of P&amp;S">
        </div>
    </section>

    <section id="contact" class="bleed red tall">
        <div class="s10 center"><h2>Contact</h2></div>
        <div class="s10 center"><h4 class="mono">For new projects:
            <br><a href="mailto:Cat@pitchandsync.com">Cat@pitchandsync.com</a>
            <br><br>
            For composers/music submissions:
            <br><a href="mailto:Info@pitchandsync.com">Info@pitchandsync.com</a>
            <br><br>
            Sign up to our mailing list:</h4>
            <form class="mailing-list-form">
                <label for="mailing-list-email" class="sr-only">Email address</label>
                <input id="mailing-list-email" name="email" type="email" placeholder="Email input field" autocomplete="email" required>
                <button type="submit" aria-label="Submit email address">
                    <img src="../assets/icons/play.svg" alt="">
                </button>
            </form>
        </div>

        <div class="s12 center holding-socials">
            <a href="https://www.instagram.com/pitchandsync/" target="_blank" rel="noopener noreferrer" aria-label="Instagram"><div class="icon instagram"></div></a>
            <a href="https://www.linkedin.com/company/pitch-&-sync/" target="_blank" rel="noopener noreferrer" aria-label="LinkedIn"><div class="icon linkedin"></div></a>
        </div>
    </section>


    <div id="footer"></div>

    <script src="../js/cursor.js?v=2"></script>
    <script src="../js/partials.js?v=3"></script>
    <script src="../js/noise.js"></script>
    <script src="../js/contact.js"></script>
    <script src="../js/media.js"></script>
    <script src="/js/layout.js"></script>

</body>
</html>
