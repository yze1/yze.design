<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/png" href="/favicon.png">
    
    <title>P&S</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <link rel="stylesheet" href="../css/variables.css">
    <link rel="stylesheet" href="/css/cursor.css">
    <link rel="stylesheet" href="/css/layout.css">
    <link rel="stylesheet" href="../css/typography.css">
    <link rel="stylesheet" href="../css/noise.css">
    <link rel="stylesheet" href="../css/media.css">
    <script src="https://cdn.jsdelivr.net/npm/@mux/mux-player" defer></script>
    <style>
        .holding-header .header-row .caption a:not([href$="/contact/"]):not([href="#contact"]),
        .holding-header .mobile-menu a:not([href$="/contact/"]):not([href="#contact"]) {display: none;}

        .twenty-years {
            position: relative;
            display: block;
            width: min(500px, 70vw);
            aspect-ratio: 1;
            animation: rotate-twenty-years 30s linear infinite;
        }

        .twenty-years::before,
        .twenty-years::after {
            content: "";
            position: absolute;
            inset: 0;
            -webkit-mask: url("../assets/media/20years.png") center / contain no-repeat;
            mask: url("../assets/media/20years.png") center / contain no-repeat;
        }

        .twenty-years::before {background: var(--red);}

        .twenty-years::after {
            background: var(--noise) repeat;
            background-size: 203px;
            filter: contrast(125%) brightness(67%);
            opacity: 0;
        }

        html.noise-on .twenty-years::after {opacity: 0.06;}

        .holding-video {position: relative;}

        .twenty-years-overlay {
            position: absolute;
            z-index: 1;
            inset: 0;
            display: grid;
            place-items: center;
            pointer-events: none;
        }

        @keyframes rotate-twenty-years {to {transform: rotate(360deg);}}

        @media (prefers-reduced-motion: reduce) {
            .twenty-years {animation: none;}
        }

        html, body {background-color: var(--black);}
    </style>
</head>
<body>
    <div id="cursor">
        <h4><strong>&</strong></h4>
    </div>

    <div id="header" data-theme="holding-header"></div>



    <section class="compact underlap">
        <div class="s12 bleed full holding-video">
            <mux-player
                playback-id="bm55J3LyyfzFat00ZVs2MlI3FfsBonjmFiJ8202v69yZs"
                metadata-video-title="reel_trimmed"
                autoplay="muted"
                muted
                loop
                playsinline
                no-muted-pref
                aria-label="Play reel with sound"
                tabindex="0"
            ></mux-player>
            <div class="twenty-years-overlay">
                <span class="twenty-years" role="img" aria-label="20 Years of P&amp;S"></span>
            </div>
        </div>
    </section>

    <section class="red">
        <div class="space"></div>
        <div class="s12 center">
            <h2>
                New website
                <br>coming soon
            </h2>
            <h4 class="mono caps">One short line on services</h4>
        </div>
    </section>

    <div id="contact-partial"></div>


    <div id="footer"></div>

    <script src="../js/cursor.js?v=2"></script>
    <script src="../js/partials.js?v=3"></script>
    <script src="../js/noise.js"></script>
    <script src="../js/contact.js"></script>
    <script src="../js/media.js"></script>
    <script src="/js/layout.js"></script>

</body>
</html>
