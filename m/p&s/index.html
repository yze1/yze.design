    <style>
        .gong-scroll {
            position: relative;
            height: 300vh;
            padding: 0;
            background: #000000;
        }

        .gong-frame {
            grid-column: 1 / -1;
            position: sticky;
            top: 0;
            width: 100%;
            height: 100vh;
            overflow: hidden;
            background: #000000;
        }

        .gong-frame img {
            width: calc(100% + var(--margin));
            max-width: none;
            height: 100%;
            margin-left: calc(var(--margin) * -0.5);
            object-fit: contain;
            /* transform: scale(var(--gong-scale, 1)); */
            mix-blend-mode: lighten;
            will-change: transform;
        }

        .gong-dot {
            position: absolute;
            top: 50%;
            left: 50%;
            width: calc(var(--dot-radius, 0) * 2);
            aspect-ratio: 1;
            border-radius: 50%;
            transform: translate(-50%, -50%);
            will-change: width;
        }

        .gong-title {
            position: absolute;
            z-index: 1;
            top: 50%;
            left: 50%;
            width: calc(100% - (var(--margin) * 2));
            margin: 0;
            text-align: center;
            transform: translate(-50%, -50%);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: var(--inner-gap);
        }

        .gong-title :is(h3, h4) {
            margin: 0;
            line-height: 1;
            color: inherit;
        }

        .gong-title strong {color: inherit;}
        .gong-title .spread {width: max-content;}

        .gong-title--blend {
            color: var(--black);
            clip-path: circle(var(--dot-radius, 0) at 50% 50%);
            will-change: clip-path;
        }

        .gong-tagline {
            position: absolute;
            z-index: 1;
            top: 65%;
            left: 50%;
            width: calc(100% - var(--margin));
            display: flex;
            flex-direction: column;
            align-items: center;
            color: var(--black);
            transform: translate(-50%, var(--tagline-offset, 35vh));
            will-change: transform;
        }

        .gong-tagline :is(h2, h5) {color: inherit; text-align: center;}

        .gong-circle-noise {
            position: absolute;
            z-index: 2;
            inset: 0;
            pointer-events: none;
            background: var(--noise) repeat;
            background-size: 200px 200px;
            opacity: 0.15;
            clip-path: circle(var(--dot-radius, 0) at 50% 50%);
            will-change: clip-path;
        }

        img.gif {
            display: block;
            width: 100%;
            aspect-ratio: 1;
            object-fit: cover;
        }
    </style>

    <style>
        .twenty-years {
            position: relative;
            display: block;
            width: min(500px, 70vw);
            aspect-ratio: 1;
            animation: rotate-twenty-years 30s linear infinite;
        }

        .twenty-years::before,
        .twenty-years::after {
            content: "";
            position: absolute;
            inset: 0;
            -webkit-mask: url("./assets/media/20years.png") center / contain no-repeat;
            mask: url("./assets/media/20years.png") center / contain no-repeat;
        }

        .twenty-years::before {background: var(--red);}

        .twenty-years::after {
            background: var(--noise) repeat;
            background-size: 203px;
            filter: contrast(125%) brightness(67%);
            opacity: 0;
        }

        html.noise-on .twenty-years::after {opacity: 0.06;}

        .holding-video {position: relative;}

        .twenty-years-overlay {
            position: absolute;
            z-index: 1;
            inset: 0;
            display: grid;
            place-items: center;
            pointer-events: none;
        }

        @keyframes rotate-twenty-years {to {transform: rotate(360deg);}}

        @media (prefers-reduced-motion: reduce) {
            .twenty-years {animation: none;}
        }

        html, body {background-color: var(--black);}
    </style>

    <script>
        const gongScroll = document.querySelector(".gong-scroll");
        const gongFrame = document.querySelector(".gong-frame");
        // const circleStart = 0.5; // 0 = immediately, 1 = at the end of the scroll section.
        const circleStart = 0.2; // 0 = immediately, 1 = at the end of the scroll section.

        function fitGongTitles() {
            const frameStyle = getComputedStyle(gongFrame);
            const availableWidth = gongFrame.clientWidth
                - parseFloat(frameStyle.paddingLeft)
                - parseFloat(frameStyle.paddingRight);

            document.querySelectorAll(".gong-title .spread").forEach(title => {
                title.style.fontSize = "";
                const naturalSize = parseFloat(getComputedStyle(title).fontSize);
                title.style.fontSize = `${naturalSize * availableWidth / title.scrollWidth}px`;
            });
        }

        function updateGong() {
            const distance = gongScroll.offsetHeight - innerHeight;
            const progress = Math.max(0, Math.min(1, -gongScroll.getBoundingClientRect().top / distance));
            const dotProgress = Math.max(0, (progress - circleStart) / (1 - circleStart));

            // gongFrame.style.setProperty("--gong-scale", 1 + Math.min(progress * 2, 1));
            gongFrame.style.setProperty("--dot-radius", `${dotProgress * 75}vmax`);
            gongFrame.style.setProperty("--tagline-offset", `${(1 - dotProgress) * 35}vh`);
            const gongBounds = gongScroll.getBoundingClientRect();
            const headerY = document.querySelector("#header")?.getBoundingClientRect().height / 2 || 0;
            const radius = dotProgress * 0.75 * Math.max(innerWidth, innerHeight);
            window.gongHeaderRed = gongBounds.bottom > 0 && radius >= Math.abs(innerHeight / 2 - headerY);
            window.updateHeaderColor?.();
        }

        addEventListener("scroll", updateGong, {passive: true});
        addEventListener("resize", updateGong);
        addEventListener("resize", fitGongTitles);
        document.fonts?.ready.then(fitGongTitles);
        fitGongTitles();
        updateGong();
    </script>
