<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shape Generator</title>
    <!-- Load p5.js library from CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.4.0/p5.js"></script>
    <!-- Load p5.js SVG library -->
    <script src="https://unpkg.com/p5.js-svg@1.5.1"></script>
    <!-- Load gif.js library -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gif.js/0.2.0/gif.js"></script>
    <!-- Load JSZip library -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.7.1/jszip.min.js"></script>
    <!-- Load our custom styles -->
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="app-container">
        <!-- Controls panel -->
        <div class="controls">
            <!-- Canvas Size -->
            <h2>Canvas Size</h2>
            <div class="control-group">
                <div class="label-row">
                    <label>Aspect Ratio</label>
                    <span class="value-display">4:5</span>
                </div>
                <div class="canvas-options-container">
                    <div class="canvas-options">
                        <button class="canvas-option" data-width="1080" data-height="1920">9:16</button>
                        <button class="canvas-option selected" data-width="1080" data-height="1350">4:5</button>
                    </div>
                    <div class="canvas-options">
                        <button class="canvas-option" data-width="1080" data-height="1080">1:1</button>
                        <button class="canvas-option" data-width="1080" data-height="560">16:9</button>
                    </div>
                </div>
                <input type="hidden" id="canvas-size" value="4:5">
            </div>

            <h2>Parameters</h2>

            <div class="control-group">
                <div class="label-row">
                    <label>Weather</label>
                    <span class="value-display">☀️</span>
                </div>
                <div class="weather-options-container">
                    <div class="weather-options">
                        <button class="weather-option selected" data-preset="sunny">☀️</button>
                        <button class="weather-option" data-preset="rainy">☔️</button>
                    </div>
                    <div class="weather-options">
                        <button class="weather-option" data-preset="storm">🌩️</button>
                        <button class="weather-option" data-preset="snow">❄️</button>
                    </div>
                </div>
            </div>

            <!-- Action buttons - always visible -->
            <div class="control-group">
                <div class="button-row">
                    <button id="randomise-btn" class="action-button">🔀</button>
                    <button id="regenerate-btn" class="action-button">🔁</button>
                </div>
                <div class="button-row">
                    <button id="play-btn" class="action-button">▶️</button>
                    <button id="save-btn" class="action-button">Save</button>
                </div>
            </div>

            <button id="advanced-options-btn" class="action-button">Advanced Options</button>

            <div id="advanced-controls" style="display: none;">
                <div class="control-group">
                    <button id="load-params-btn" class="action-button">Load Parameters</button>
                </div>

                <h2>Colours</h2>

                <div class="control-group">
                    <div class="label-row">
                        <label>Fill Colour</label>
                        <span class="value-display">#000000</span>
                    </div>
                    <div class="color-options fill-colors">
                        <button class="color-option" data-color="#00be55"></button>
                        <button class="color-option" data-color="#fff603"></button>
                        <button class="color-option" data-color="#0058c5"></button>
                        <button class="color-option" data-color="#ff0205"></button>
                        <button class="color-option" data-color="#000000"></button>
                        <button class="color-option" data-color="#ffffff"></button>
                    </div>
                    <input type="hidden" id="fill-color" value="#000000">
                </div>

                <div class="control-group">
                    <div class="label-row">
                        <label>Stroke Colour</label>
                        <span class="value-display">#000000</span>
                    </div>
                    <div class="color-options stroke-colors">
                        <button class="color-option" data-color="#00be55"></button>
                        <button class="color-option" data-color="#fff603"></button>
                        <button class="color-option" data-color="#0058c5"></button>
                        <button class="color-option" data-color="#ff0205"></button>
                        <button class="color-option selected" data-color="#000000"></button>
                        <button class="color-option" data-color="#ffffff"></button>
                    </div>
                    <input type="hidden" id="stroke-color" value="#000000">
                </div>

                <div class="control-group">
                    <div class="label-row">
                        <label>Background Colour</label>
                        <span class="value-display">#ffffff</span>
                    </div>
                    <div class="color-options background-colors">
                        <button class="color-option" data-color="#00be55"></button>
                        <button class="color-option" data-color="#fff603"></button>
                        <button class="color-option" data-color="#0058c5"></button>
                        <button class="color-option" data-color="#ff0205"></button>
                        <button class="color-option" data-color="#000000"></button>
                        <button class="color-option selected" data-color="#ffffff"></button>
                    </div>
                    <input type="hidden" id="background-color" value="#ffffff">
                </div>

                <h2>Shape Controls</h2>
                <!-- Point count control -->
                <div class="control-group">
                    <div class="label-row">
                        <label for="point-count">Number of Points</label>
                        <span class="value-display">6</span>
                    </div>
                    <input type="range" id="point-count" min="3" max="24" value="6">
                </div>

                <!-- Corner radius control -->
                <div class="control-group">
                    <div class="label-row">
                        <label for="corner-radius">Corner Radius</label>
                        <span class="value-display">0%</span>
                    </div>
                    <input type="range" id="corner-radius" min="0" max="50" value="0">
                </div>

                <!-- Stroke weight control -->
                <div class="control-group">
                    <div class="label-row">
                        <label for="stroke-weight">Stroke Weight</label>
                        <span class="value-display">2</span>
                    </div>
                    <input type="range" id="stroke-weight" min="0" max="40" value="2">
                </div>

                <!-- Point randomness control -->
                <div class="control-group">
                    <div class="label-row">
                        <label for="point-randomness">Uniformity</label>
                        <span class="value-display">0.5</span>
                    </div>
                    <input type="range" id="point-randomness" min="0" max="1" step="0.01" value="0.5">
                </div>
                
                <!-- Shape size control -->
                <div class="control-group">
                    <div class="label-row">
                        <label for="shape-size">Shape Size</label>
                        <span class="value-display">100</span>
                    </div>
                    <input type="range" id="shape-size" min="10" max="500" value="100">
                </div>

                <h2>Multi Controls</h2>
                <!-- Shape count control -->
                <div class="control-group">
                    <div class="label-row">
                        <label for="shape-count">Number of Shapes</label>
                        <span class="value-display">1</span>
                    </div>
                    <input type="range" id="shape-count" min="1" max="24" value="1">
                </div>
                
                <!-- Shape spread control -->
                <div class="control-group">
                    <div class="label-row">
                        <label for="shape-spread">Shape Spread</label>
                        <span class="value-display">100</span>
                    </div>
                    <input type="range" id="shape-spread" min="0" max="500" value="100">
                </div>

                <!-- Rotation control -->
                <div class="control-group">
                    <div class="label-row">
                        <label for="shape-rotation">Rotation</label>
                        <span class="value-display">0°</span>
                    </div>
                    <input type="range" id="shape-rotation" min="0" max="360" value="0">
                </div>
                
                <!-- Placement randomness control -->
                <div class="control-group">
                    <div class="label-row">
                        <label for="placement-randomness">Placement Randomness</label>
                        <span class="value-display">0</span>
                    </div>
                    <input type="range" id="placement-randomness" min="0" max="2" step="0.01" value="0">
                </div>
                
                <div class="spacer"></div>
            </div>
        </div>
        
        <!-- Canvas container -->
        <div class="canvas-container">
            <div id="shape-canvas"></div>
        </div>
    </div>

    <!-- Scripts -->
    <script src="p5setup.js"></script>
    <script src="script.js"></script>
</body>
</html>
