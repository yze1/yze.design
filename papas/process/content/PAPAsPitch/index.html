<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Presentation</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
        }
        .slide-container {
            width: 100%;
            height: 100%;
            position: relative;
        }
        .slide {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: none;
        }
        .slide.active {
            display: block;
        }
        iframe {
            width: 100%;
            height: 100%;
            border: none;
        }
        .navigation {
            position: fixed;
            bottom: 20px;
            right: 20px;
            z-index: 1000;
            display: flex;
            gap: 10px;
        }
        .nav-btn {
            background-color: rgba(0, 0, 0, 0.5);
            color: white;
            border: none;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            font-size: 18px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .nav-btn:hover {
            background-color: rgba(0, 0, 0, 0.8);
        }
        .slide-number {
            position: fixed;
            bottom: 20px;
            left: 20px;
            z-index: 1000;
            background-color: rgba(0, 0, 0, 0.5);
            color: white;
            padding: 5px 10px;
            border-radius: 20px;
            font-family: Arial, sans-serif;
        }
    </style>
</head>
<body>
    <div class="slide-container">
        <div class="slide active" id="slide1">
            <iframe src="slide1.html"></iframe>
        </div>
        <div class="slide" id="slide2">
            <iframe src="slide2.html"></iframe>
        </div>
        <div class="slide" id="slide3">
            <iframe src="slide3.html"></iframe>
        </div>
        <div class="slide" id="slide4">
            <iframe src="slide4.html"></iframe>
        </div>
        <div class="slide" id="slide5">
            <iframe src="slide5.html"></iframe>
        </div>
        <div class="slide" id="slide6">
            <iframe src="slide6.html"></iframe>
        </div>
        <div class="slide" id="slide7">
            <iframe src="slide7.html"></iframe>
        </div>
        <div class="slide" id="slide8">
            <iframe src="slide8.html"></iframe>
        </div>
        <div class="slide" id="slide9">
            <iframe src="slide9.html"></iframe>
        </div>
    </div>

    <div class="navigation">
        <button class="nav-btn" id="prevBtn">&#9664;</button>
        <button class="nav-btn" id="nextBtn">&#9654;</button>
    </div>

    <div class="slide-number" id="slideNumber">1 / 9</div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const slides = document.querySelectorAll('.slide');
            const prevBtn = document.getElementById('prevBtn');
            const nextBtn = document.getElementById('nextBtn');
            const slideNumber = document.getElementById('slideNumber');
            let currentSlide = 0;
            const totalSlides = slides.length;

            function showSlide(index) {
                slides.forEach((slide, i) => {
                    if (i === index) {
                        slide.classList.add('active');
                    } else {
                        slide.classList.remove('active');
                    }
                });
                slideNumber.textContent = `${index + 1} / ${totalSlides}`;
            }

            function nextSlide() {
                currentSlide = (currentSlide + 1) % totalSlides;
                showSlide(currentSlide);
            }

            function prevSlide() {
                currentSlide = (currentSlide - 1 + totalSlides) % totalSlides;
                showSlide(currentSlide);
            }

            // Button event listeners
            nextBtn.addEventListener('click', nextSlide);
            prevBtn.addEventListener('click', prevSlide);

            // Keyboard navigation
            document.addEventListener('keydown', (e) => {
                switch (e.key) {
                    case 'ArrowRight':
                    case ' ':
                        nextSlide();
                        break;
                    case 'ArrowLeft':
                        prevSlide();
                        break;
                }
            });
        });
    </script>
</body>
</html>
