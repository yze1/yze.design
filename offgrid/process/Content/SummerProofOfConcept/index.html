<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Page Sections</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div id="container">
        <div id="page"></div>
        <div id="controls">
            <h3>Controls</h3>
            <label for="pageWidth">Page Width</label>
            <input type="number" id="pageWidth" value="800"><br>
            
            <label for="pageHeight">Page Height</label>
            <input type="number" id="pageHeight" value="1200"><br>
            
            <label for="marginTop">Margin Top</label>
            <input type="number" id="marginTop" value="50"><br>
            
            <label for="marginBottom">Margin Bottom</label>
            <input type="number" id="marginBottom" value="50"><br>
            
            <label for="marginLeft">Margin Left</label>
            <input type="number" id="marginLeft" value="50"><br>
            
            <label for="marginRight">Margin Right</label>
            <input type="number" id="marginRight" value="50"><br>
            
            <label for="columnNumber">Columns</label>
            <input type="number" id="columnNumber" value="6"><br>
            
            <label for="rowNumber">Rows</label>
            <input type="number" id="rowNumber" value="8"><br>
            
            <button id="applyChanges">Apply Changes</button>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
